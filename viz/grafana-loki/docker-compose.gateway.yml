# SSN project - Loki + Grafana on the gateway (test setup).
# Host network: no Docker networks or NAT rules on the firewall.
# Both services listen only on 127.0.0.1, so only the gateway itself can use them.
# Alloy runs natively on the gateway (alloy/gateway.alloy).
# Run: sudo docker compose -f docker-compose.gateway.yml up -d
services:
  loki:
    image: grafana/loki:latest
    network_mode: host
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -server.http-listen-address=127.0.0.1
      - -server.grpc-listen-address=127.0.0.1
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
      GF_SERVER_HTTP_PORT: "3000"
      LOKI_URL: "http://127.0.0.1:3100"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    restart: unless-stopped
